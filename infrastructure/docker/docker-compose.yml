# ============================================================================
# docker-compose.yml - Orchestrate Spark ETL và dbt containers (BigQuery)
# ============================================================================
# Chạy: docker-compose -f docker-compose.yml up
# ============================================================================

version: '3.8'

services:
  # ========================================================================
  # Spark ETL Service - Chạy ETL jobs
  # ========================================================================
  spark-etl:
    # Build image từ Dockerfile.spark
    build:
      context: ../.. # Project root
      dockerfile: infrastructure/docker/Dockerfile.spark

    container_name: spark-etl-container

    # Load biến môi trường từ .env file
    env_file:
      - ../../.env

    # Volumes - Mount thư mục từ host vào container
    volumes:
      - ../../data:/app/data # Data folder (read-write)
      - ../../spark:/app/spark:ro # Source code (read-only)
      - ../../infrastructure:/app/infrastructure:ro
      - ../../gcp_service_account.json:/app/gcp_service_account.json:ro # Service Account

    networks:
      - nyc-taxi-net

    restart: "no"

  # ========================================================================
  # dbt Service - Transform data từ Spark ETL
  # ========================================================================
  dbt:
    # Build image từ Dockerfile.dbt
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dbt

    container_name: dbt-transformer-container

    # Load biến môi trường
    env_file:
      - ../../.env

    environment:
      - GCP_KEYFILE_PATH=/app/gcp_service_account.json

    # Volumes
    volumes:
      - ../../dbt:/app/dbt # dbt project (read-write)
      - ../../data:/app/data # Manifest + cleanup raw/processed sau dbt test
      - ../../spark:/app/spark:ro # Chạy ETL finalizer sau dbt test
      - ../../infrastructure:/app/infrastructure:ro
      - ../../gcp_service_account.json:/app/gcp_service_account.json:ro # Service Account

    # Connect tới docker network
    networks:
      - nyc-taxi-net

    # Không restart nếu exit
    restart: "no"

    depends_on:
      spark-etl:
        condition: service_completed_successfully

# ============================================================================
# Docker Networks
# ============================================================================
networks:
  nyc-taxi-net:
    driver: bridge # Bridge driver (default)

