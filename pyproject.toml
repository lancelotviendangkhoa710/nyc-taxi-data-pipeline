[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34.0",
    "redshift-connector>=2.1.1",
    "pyarrow>=14.0",
    "pyspark>=3.5.0,<3.6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "dbt-redshift>=1.8.0",
    "pytest>=8.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0",
]

[tool.setuptools.packages.find]
include = ["spark*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/architecture.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports OK in tests
"scripts/check_bq_integrity.py" = ["E402"]
"scripts/check_redshift_integrity.py" = ["E402"]
"scripts/load_bq_all.py" = ["E402"]
"scripts/reset_bigquery_noconfirm.py" = ["E402"]
"scripts/reset_redshift_noconfirm.py" = ["E402"]
