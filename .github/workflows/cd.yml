name: CD - Deploy to EC2

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting deployment..."
            
            # Đi vào thư mục project
            cd ~/nyc-taxi-de-project
            
            # EC2 là deployment host: repair ownership before Git mutates
            # tracked files. Docker bind mounts can leave root-owned dbt artifacts.
            # Không chạy Git bằng sudo để tránh root-owned files trong .git.
            sudo chown -R ec2-user:ec2-user .
            sudo chmod -R u+rwX .

            # Discard local drift, untracked artifacts, then sync exact deploy commit.
            git fetch origin main
            git reset --hard ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'origin/main' }}
            git clean -fd
            
            # Cấp quyền lại phòng hờ
            sudo setfacl -m user:50000:rw /var/run/docker.sock || true
            sudo chown -R ec2-user:ec2-user ~/nyc-taxi-de-project/data || true
            
            # Build lại image nếu có thay đổi trong Dockerfile hoặc requirements
            docker compose -f infrastructure/docker/docker-compose.yml build
            
            # Restart Airflow (Scheduler & Webserver) để nhận code Python/DAG mới
            docker compose -f infrastructure/docker/docker-compose.airflow.yml restart
            
            echo "Deployment successful!"