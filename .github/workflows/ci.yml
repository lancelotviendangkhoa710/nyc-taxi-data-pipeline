name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4.0"
      - run: ruff check .
      - run: ruff format --check .

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-redshift>=1.8.0"
      - run: dbt deps --project-dir dbt --profiles-dir dbt
      - name: Parse dbt project
        env:
          REDSHIFT_HOST: ci-parse-only.invalid
          REDSHIFT_USER: ci_parser
          REDSHIFT_PASSWORD: ci-parse-only-password
          REDSHIFT_DB: dev
        run: dbt parse --project-dir dbt --profiles-dir dbt --no-partial-parse

