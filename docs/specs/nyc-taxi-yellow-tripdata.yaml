name: nyc-taxi-yellow-tripdata
version: 1.0.0
description: ETL pipeline for NYC Yellow Taxi trip data.

source:
  type: s3
  path: s3://nyc-tlc/trip data/yellow_tripdata_*.parquet

transformations:
  - name: clean_tripdata
    model: dbt.models.staging.stg_yellow_tripdata
    logic: spark.etl.load_warehouse.clean_data
  - name: aggregate_trips
    model: dbt.models.marts.fct_taxi_trips

validation:
  rules:
    - column: trip_distance
      min: 0
    - column: passenger_count
      min: 0
      max: 10

output:
  destination: warehouse/yellow_tripdata_final
  format: parquet